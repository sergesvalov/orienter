services:
  web:
    image: node:20-alpine
    container_name: orienter-web-dev
    working_dir: /app
    # Монтируем локальный код для Hot Reloading
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    # Запускаем Vite dev server с доступом снаружи контейнера
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    image: node:20-alpine
    container_name: orienter-backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./backend/.env
